[package]
name = "zapfast-platform-clipboard"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The arboard surface ZapFast uses: the desktop crate itself, or HarmonyOS's pasteboard through the app's own bridge"

[lib]
name = "arboard"
path = "src/lib.rs"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
upstream = { package = "arboard", version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
