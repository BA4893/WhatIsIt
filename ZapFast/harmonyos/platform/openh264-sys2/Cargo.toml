[package]
name = "zapfast-platform-openh264-sys2"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The openh264-sys2 surface ZapFast uses: the desktop crate itself, or the bits its HarmonyOS stand-in keeps"

[lib]
name = "openh264_sys2"
path = "src/lib.rs"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
upstream = { package = "openh264-sys2", version = "0.9", default-features = false }
