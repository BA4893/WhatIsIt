[package]
name = "zapfast-platform-audio"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "The fastframe-audio surface ZapFast uses: the desktop crate itself, or HarmonyOS silence until OHAudio is bound"

[lib]
name = "fastframe_audio"
path = "src/lib.rs"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
upstream = { package = "fastframe-audio", git = "https://github.com/crmne/fastframe", tag = "v0.16.1" }
